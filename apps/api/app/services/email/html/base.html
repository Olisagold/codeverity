<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>${subject}</title>
</head>
<body style="margin:0;padding:0;background:#FFFFFF;">
<div style="display:none;max-height:0;overflow:hidden;">${preview}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" style="background:#FFFFFF;">
  <tr><td align="center" style="padding:48px 24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

      <tr><td style="padding:0 0 40px;">
        <a href="${app_url}" style="text-decoration:none;"><img src="${assets_url}/logo-dark.png" alt="Codeverity" height="28" style="display:block;border:0;height:28px;width:auto;"></a>
      </td></tr>

      ${body}

      <tr><td style="padding:40px 0 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #E5E7EB;font-size:0;line-height:0;">&nbsp;</td></tr></table>
      </td></tr>

      <tr><td style="padding:32px 0 0;font-size:15px;line-height:1.6;color:#6B7280;">
        <a href="${app_url}" style="color:#6B7280;text-decoration:none;">Website</a>
        <span style="color:#9CA3AF;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
        <a href="${app_url}/docs" style="color:#6B7280;text-decoration:none;">Docs</a>
        <span style="color:#9CA3AF;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
        <a href="${app_url}/login" style="color:#6B7280;text-decoration:none;">Sign in</a>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0 0;"><tr>
          <td style="padding:0 16px 0 0;"><a href="${x_url}"><img src="${assets_url}/social/x.png" alt="X" width="20" height="20" style="display:block;border:0;width:20px;height:20px;"></a></td>
          <td style="padding:0 16px 0 0;"><a href="${linkedin_url}"><img src="${assets_url}/social/linkedin.png" alt="LinkedIn" width="20" height="20" style="display:block;border:0;width:20px;height:20px;"></a></td>
          <td><a href="${github_url}"><img src="${assets_url}/social/github.png" alt="GitHub" width="20" height="20" style="display:block;border:0;width:20px;height:20px;"></a></td>
        </tr></table>
        <p style="margin:20px 0 0;">&copy; ${year} Codeverity. All rights reserved.</p>
        <p style="margin:12px 0 0;font-size:13px;color:#9CA3AF;">${footer_note}</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
