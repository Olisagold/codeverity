<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>${subject}</title>
</head>
<body style="margin:0;padding:0;background:#FFFFFF;">
<div style="display:none;max-height:0;overflow:hidden;">${preview}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" style="background:#FFFFFF;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" style="max-width:520px;background:#FFFFFF;border:1px solid #E4E4E7;border-radius:16px;font-family:Inter,-apple-system,'Segoe UI',Arial,Helvetica,sans-serif;">

      <tr><td align="center" style="padding:28px 32px;border-bottom:1px solid #F4F4F5;font-size:16px;font-weight:600;letter-spacing:-0.2px;color:#09090B;">
        Codeverity
      </td></tr>

      ${body}

      <tr><td style="padding:40px 36px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #F4F4F5;font-size:0;line-height:0;">&nbsp;</td></tr></table>
      </td></tr>

      <tr><td align="center" style="padding:28px 36px 32px;font-size:13px;line-height:1.6;color:#71717A;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 20px;"><tr>
          <td style="padding:0 8px;"><a href="${instagram_url}"><img src="${assets_url}/social/instagram.png" alt="Instagram" width="22" height="22" style="display:block;border:0;width:22px;height:22px;"></a></td>
          <td style="padding:0 8px;"><a href="${x_url}"><img src="${assets_url}/social/x.png" alt="X" width="22" height="22" style="display:block;border:0;width:22px;height:22px;"></a></td>
          <td style="padding:0 8px;"><a href="${linkedin_url}"><img src="${assets_url}/social/linkedin.png" alt="LinkedIn" width="22" height="22" style="display:block;border:0;width:22px;height:22px;"></a></td>
        </tr></table>
        <a href="${app_url}" style="color:#3F3F46;text-decoration:none;">Website</a>
        <span style="color:#D4D4D8;">&nbsp;|&nbsp;</span>
        <a href="${app_url}/docs" style="color:#3F3F46;text-decoration:none;">Docs</a>
        <span style="color:#D4D4D8;">&nbsp;|&nbsp;</span>
        <a href="${app_url}/login" style="color:#3F3F46;text-decoration:none;">Sign in</a>
        <p style="margin:16px 0 0;font-size:12px;color:#A1A1AA;">Multi model code assessment API</p>
      </td></tr>

    </table>
    <p style="max-width:520px;margin:20px auto 0;font-family:Inter,-apple-system,'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#A1A1AA;text-align:center;">${footer_note}</p>
  </td></tr>
</table>
</body>
</html>
